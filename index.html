<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segurança - Banco Style</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="card">
      <h1>Central de Proteção</h1>
      <p>Seu dinheiro protegido com múltiplas camadas de segurança.</p>

      <div class="security-item">
        <span> Proteção por biometria</span>
        <button>Ativado</button>
      </div>

      <div class="security-item">
        <span> Dispositivos conectados</span>
        <button>Gerenciar</button>
      </div>

      <div class="security-item">
        <span> Autenticação em duas etapas</span>
        <button>Ativar</button>
      </div>

      <div class="security-item">
        <span> Modo Rua</span>
        <button>Configurar</button>
      </div>

    </div>

  </div>

</body>
</html>
